version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # eslint-plugin-react, eslint-plugin-import and eslint-plugin-jsx-a11y
      # (pulled in by eslint-config-next) only support eslint up to 9.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "daily"
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # pydantic pins pydantic-core to an exact version; bump it together with pydantic.
      - dependency-name: "pydantic-core"
