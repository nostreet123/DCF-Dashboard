version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # eslint-plugin-react, eslint-plugin-import and eslint-plugin-jsx-a11y
      # (pulled in by eslint-config-next) only support eslint up to 9.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "daily"
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # pydantic pins pydantic-core to an exact version, so standalone bumps never
      # resolve. When merging a pydantic bump, update pydantic_core in
      # constraints.txt and regenerate requirements.lock.txt in the same PR.
      # Scoped to version updates so security updates still come through.
      - dependency-name: "pydantic-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
