name: CI

# Use pull_request (not pull_request_target) so fork PRs never receive repository secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    # dependency-review-action only auto-derives refs for pull_request events.
    if: github.event_name == 'pull_request'
    # GitHub's dependency-review action requires extra repository features on private repos.
    # Keep the check green on private repos where the feature is unavailable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review unavailable
        if: ${{ github.event.repository.private && vars.ENABLE_GITHUB_DEPENDENCY_REVIEW != 'true' }}
        run: |
          echo "Dependency review is unavailable for this private repository."
          echo "Set ENABLE_GITHUB_DEPENDENCY_REVIEW=true only after enabling the required GitHub security features."
      - name: Review dependency changes
        if: ${{ !github.event.repository.private || vars.ENABLE_GITHUB_DEPENDENCY_REVIEW == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown

  js-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Activate pinned npm
        run: |
          corepack enable
          corepack prepare npm@11.6.2 --activate
      - name: Install dependencies
        run: npm ci
      - name: Verify npm registry signatures
        run: npm audit signatures

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements-dev.txt -c python/constraints.txt
      - name: Set up Bun (test runner)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.10'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run harness
        run: npm run harness:verify

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Activate pinned npm
        run: |
          corepack enable
          corepack prepare npm@11.6.2 --activate
      - name: Set up Bun (test runner)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.10'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Run targeted Playwright smoke
        run: npm run harness:e2e:smoke
